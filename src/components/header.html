<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plannix header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body class="header-document">
    <header class="topbar">
      <div class="breadcrumb"><span>Workspace</span><span class="breadcrumb-separator">/</span><strong id="page-title">Dashboard</strong></div>
      <div class="topbar-right">
        <span class="today-label" id="today-label"></span>
        <span class="top-avatar" aria-label="My workspace">PX</span>
      </div>
    </header>
    <script>
      document.querySelector("#page-title").textContent =
        new URLSearchParams(window.location.search).get("title") || "Dashboard";
      document.querySelector("#today-label").textContent =
        new Date().toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    </script>
  </body>
</html>
