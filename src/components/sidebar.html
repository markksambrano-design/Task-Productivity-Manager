    </aside>
    <script>
      const activePage = new URLSearchParams(window.location.search).get("page") || "dashboard";
      const activeLink = document.querySelector(`[data-page="${activePage}"]`);
      if (activeLink) {
        activeLink.classList.add("active");
        activeLink.setAttribute("aria-current", "page");
        const revealActiveLink = () => {
          if (document.body.classList.contains("compact-sidebar")) {
            const navigation = activeLink.closest("nav");
            navigation.scrollLeft = activeLink.offsetLeft - navigation.offsetLeft;
          }
        };
        new MutationObserver(revealActiveLink).observe(document.body, {
          attributes: true,
          attributeFilter: ["class"],
        });
        window.setTimeout(revealActiveLink, 0);
      }
    </script>
